<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎨 Anime Sketch (versión estable)</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== ESTILOS BÁSICOS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0e0b14;
            color: #f0eef5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }
        .app-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background: rgba(30, 25, 45, 0.8);
            border-radius: 20px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .app-header h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #f472b6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            background: #059669;
            color: #fff;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.7rem;
        }
        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.2rem;
            width: 100%;
            max-width: 1200px;
            flex: 1;
        }
        @media (max-width: 900px) {
            .app-grid {
                grid-template-columns: 1fr 1fr;
            }
            .app-grid .panel-styles {
                grid-column: span 2;
            }
        }
        @media (max-width: 600px) {
            .app-grid {
                grid-template-columns: 1fr;
            }
            .app-grid .panel-styles {
                grid-column: span 1;
            }
        }
        .panel {
            background: rgba(24, 20, 38, 0.85);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            min-height: 400px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .panel-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #d4d0e6;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .panel-header h2 i {
            color: #a78bfa;
        }
        .btn {
            background: rgba(167, 139, 250, 0.15);
            border: 1px solid rgba(167, 139, 250, 0.2);
            color: #e0dbf5;
            padding: 0.4rem 0.9rem;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: inherit;
        }
        .btn:hover {
            background: rgba(167, 139, 250, 0.3);
            border-color: #a78bfa;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border-color: #7c3aed;
            color: #fff;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }
        .btn-success {
            background: linear-gradient(135deg, #059669, #047857);
            border-color: #059669;
            color: #fff;
        }
        .btn-sm {
            padding: 0.25rem 0.6rem;
            font-size: 0.7rem;
            border-radius: 8px;
        }
        .canvas-wrap {
            flex: 1;
            position: relative;
            background: rgba(12, 10, 20, 0.6);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .canvas-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #12101a;
            cursor: crosshair;
        }
        .canvas-wrap .placeholder {
            position: absolute;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.9rem;
            pointer-events: none;
            text-align: center;
            user-select: none;
        }
        .canvas-wrap .placeholder i {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(167, 139, 250, 0.2);
        }
        .tools-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.7rem;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            align-items: center;
        }
        .tools-row .group {
            display: flex;
            gap: 0.3rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .tools-row .group-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            margin-right: 0.2rem;
        }
        .tools-row input[type="color"] {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 2px;
            background: transparent;
            cursor: pointer;
        }
        .tools-row input[type="range"] {
            width: 70px;
            accent-color: #a78bfa;
        }
        .tools-row .size-label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.5);
            min-width: 24px;
            text-align: center;
        }
        .tools-row .btn.active-tool {
            background: rgba(167, 139, 250, 0.35);
            border-color: #a78bfa;
        }
        .styles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 0.7rem;
            flex: 1;
            align-content: start;
        }
        .style-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .style-card:hover {
            background: rgba(167, 139, 250, 0.08);
            border-color: rgba(167, 139, 250, 0.3);
        }
        .style-card.active {
            border-color: #a78bfa;
            background: rgba(167, 139, 250, 0.12);
        }
        .style-card .preview {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        .style-card .name {
            font-size: 0.65rem;
            color: #c4bdf0;
        }
        .style-card .check {
            position: absolute;
            top: 4px;
            right: 4px;
            background: #7c3aed;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.55rem;
            color: #fff;
        }
        .style-card.active .check {
            display: flex;
        }
        .upload-zone {
            border: 2px dashed rgba(167, 139, 250, 0.2);
            border-radius: 14px;
            padding: 0.5rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            cursor: pointer;
            margin-bottom: 0.7rem;
            background: rgba(167, 139, 250, 0.03);
            transition: border 0.3s;
        }
        .upload-zone:hover {
            border-color: rgba(167, 139, 250, 0.4);
        }
        .upload-zone i {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.2rem;
            color: rgba(167, 139, 250, 0.4);
        }
        .upload-zone input {
            display: none;
        }
        .preview-status {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 0.3rem;
            margin-top: 0.4rem;
            min-height: 1.8rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .footer {
            width: 100%;
            max-width: 1200px;
            margin-top: 1.2rem;
            padding: 0.6rem;
            text-align: center;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .js-status {
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .js-status.ok {
            background: #059669;
            color: #fff;
        }
        .js-status.fail {
            background: #dc2626;
            color: #fff;
        }
        .intensity-row {
            margin-top: 0.6rem;
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .intensity-row input[type="range"] {
            flex: 1;
            min-width: 60px;
            accent-color: #a78bfa;
        }
        .intensity-row label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
        }
        .intensity-row span {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            min-width: 30px;
        }
        @media (max-width: 500px) {
            .tools-row {
                flex-direction: column;
                align-items: stretch;
            }
            .tools-row .group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER con mensaje de estado JS -->
    <header class="app-header">
        <h1><i class="fas fa-wand-magic-sparkles"></i> Anime Sketch</h1>
        <div>
            <span class="js-status" id="jsStatus">⏳ Cargando...</span>
        </div>
    </header>

    <!-- GRID PRINCIPAL -->
    <div class="app-grid">

        <!-- PANEL 1: SKETCH -->
        <section class="panel panel-sketch">
            <div class="panel-header">
                <h2><i class="fas fa-pencil"></i> Boceto</h2>
                <div class="actions">
                    <button class="btn btn-sm btn-danger" id="clearSketch"><i class="fas fa-eraser"></i> Limpiar</button>
                    <button class="btn btn-sm btn-success" id="downloadSketch"><i class="fas fa-download"></i> Guardar</button>
                </div>
            </div>
            <div class="upload-zone" id="uploadZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <span>Arrastra o haz clic para subir imagen</span>
                <input type="file" id="fileInput" accept="image/*" />
            </div>
            <div class="canvas-wrap">
                <canvas id="sketchCanvas"></canvas>
                <div class="placeholder" id="sketchPlaceholder">
                    <i class="fas fa-pen-fancy"></i>
                    Dibuja aquí o sube una imagen
                </div>
            </div>
            <div class="tools-row">
                <div class="group">
                    <span class="group-label">Herramienta</span>
                    <button class="btn btn-sm active-tool" data-tool="pen" id="toolPen"><i class="fas fa-pen"></i></button>
                    <button class="btn btn-sm" data-tool="eraser" id="toolEraser"><i class="fas fa-eraser"></i></button>
                </div>
                <div class="group">
                    <span class="group-label">Color</span>
                    <input type="color" id="drawColor" value="#f472b6" />
                </div>
                <div class="group">
                    <span class="group-label">Tamaño</span>
                    <input type="range" id="brushSize" min="1" max="40" value="6" />
                    <span class="size-label" id="sizeLabel">6</span>
                </div>
            </div>
        </section>

        <!-- PANEL 2: PREVIEW -->
        <section class="panel panel-preview">
            <div class="panel-header">
                <h2><i class="fas fa-mask"></i> Vista Anime</h2>
                <div class="actions">
                    <button class="btn btn-sm btn-primary" id="generateBtn"><i class="fas fa-wand-magic-sparkles"></i> Generar</button>
                </div>
            </div>
            <div class="canvas-wrap">
                <canvas id="previewCanvas"></canvas>
                <div class="placeholder" id="previewPlaceholder">
                    <i class="fas fa-image"></i>
                    Dibuja o sube un boceto
                </div>
            </div>
            <div class="preview-status" id="previewStatus">
                💡 Dibuja para ver el efecto
            </div>
        </section>

        <!-- PANEL 3: ESTILOS -->
        <section class="panel panel-styles">
            <div class="panel-header">
                <h2><i class="fas fa-palette"></i> Estilos</h2>
                <span style="font-size:0.6rem;color:rgba(255,255,255,0.2);">Haz clic para aplicar</span>
            </div>
            <div class="styles-grid" id="stylesGrid"></div>
            <div class="intensity-row">
                <label><i class="fas fa-sliders-h"></i> Intensidad</label>
                <input type="range" id="styleIntensity" min="0.2" max="1.8" step="0.05" value="1.0" />
                <span id="intensityLabel">1.0</span>
            </div>
        </section>
    </div>

    <div class="footer">
        Anime Sketch Generator · Hecho con <i class="fas fa-heart" style="color:#f472b6;"></i> para GitHub Pages
    </div>

    <!-- ============================================================
    JAVASCRIPT — Todo aquí, sin dependencias externas (solo FontAwesome)

    <script>

        function resizeCanvases() {
            [sketchCanvas, previewCanvas].forEach((canvas, idx) => {
                const rect = canvas.parentElement.getBoundingClientRect();
                const w = Math.min(rect.width - 4, W);
                const h = Math.min(rect.height - 4, H);

                canvas.style.width = (W * ratio) + 'px';

                        canvas.width = W;

                }
            });
